<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 200px;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            background: #f8f9fb;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .icon-wrap {
            width: 42px;
            height: 42px;
            background: #e0ecfa;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-wrap svg {
            width: 22px;
            height: 22px;
            stroke: #185FA5;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .title {
            font-size: 13px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .subtitle {
            font-size: 11px;
            color: #888;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #e4e6ea;
        }

        #downloadBtn {
            width: 100%;
            padding: 9px 0;
            font-size: 13px;
            font-weight: 500;
            background: #185FA5;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: background 0.15s, transform 0.1s;
        }

        #downloadBtn:hover {
            background: #0C447C;
        }

        #downloadBtn:active {
            transform: scale(0.97);
        }

        #downloadBtn svg {
            width: 15px;
            height: 15px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #statusMsg {
            font-size: 11px;
            text-align: center;
            min-height: 16px;
            color: #888;
        }

        #statusMsg.success {
            color: hsl(123, 46%, 34%);
        }

        #statusMsg.error {
            color: hsl(6, 63%, 46%);
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="9" y1="13" x2="15" y2="13" />
                <line x1="9" y1="17" x2="15" y2="17" />
            </svg>
        </div>
        <p class="title">PDF Fetch</p>
        <p class="subtitle">Save PDFs from any page</p>
    </div>

    <div class="divider"></div>

    <button id="downloadBtn">
        <svg viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Download PDF
    </button>

    <p id="statusMsg"></p>

    <script src="popup.js"></script>
</body>

</html>
